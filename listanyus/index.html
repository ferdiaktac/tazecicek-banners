<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listanyus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/banner-main.css" />
    <link rel="stylesheet" href="../css/animate.min.css" />
  </head>

  <body style="margin: 10px">
    <main
      class="container"
      style="max-width: 1480px; margin: auto; margin-bottom: 24px"
    >
      <section class="grid">
        <!-- Hero -->
        <article class="hero surface-cream-light p-36">
          <a class="banner-link" href="/lisyantus">
            <div
              class="content content-center text-center"
              style="justify-content: space-between"
            >
              <div class="row">
                <div
                  class="animate__animated animate__fadeInDown animate__faster"
                  style="
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                  "
                >
                  <span
                    class="text-30 font-semibold content-black pb-16"
                    style="letter-spacing: var(--size-xxs)"
                    >Taptaze Lisyantuslarda</span
                  >
                  <div style="display: flex; gap: clamp(12px, 0.81vw, 12px)">
                    <p
                      class="content-brand"
                      style="
                        font-size: clamp(72px, 9.19vw, 124px);
                        font-weight: 800 !important ;
                        line-height: 0 !important ;
                        margin: 0 !important;
                        padding: 0 !important;
                        display: flex;
                        align-items: baseline;
                      "
                    >
                      <span
                        style="
                          font-size: clamp(52px, 6.49vw, 90px);
                          font-weight: 800 !important ;
                          line-height: normal !important ;
                        "
                        >%</span
                      >40
                    </p>
                    <p
                      class="content-brand"
                      style="
                        font-size: clamp(36px, 4.05vw, 60px);
                        font-weight: 800 !important;
                        display: flex;
                        align-items: start;
                        flex-direction: column;
                        line-height: normal !important ;
                        margin: 0 !important;
                        padding: 0 !important;
                      "
                    >
                      <span
                        style="
                          font-size: clamp(12px, 1.62vw, 24px);
                          font-weight: 600;
                          line-height: normal !important ;
                        "
                        >'a varan</span
                      >İndirimler
                    </p>
                  </div>
                </div>
              </div>

              <div
                class="b-btn animate__animated animate__fadeInUp animate__faster animate-delay-03s"
                style="position: relative"
              >
                ALIŞVERİŞE BAŞLA
              </div>
            </div>
          </a>
          <img
            class="figure animate__animated animate__slideInUp animate__faster animate-delay-02s"
            src="images_listanyus/slider-1-1.webp"
            style="height: clamp(372px, calc(100vw * 461 / 1200), 461px)"
          />
        </article>

        <!-- Right Top -->
        <article
          class="grid-1 animate__animated animate__fadeInRight animate__faster animate-disable-mobile p-24 surface-brand-light"
        >
          <a class="banner-link" href="/cok-satanlar">
            <div class="content content-left text-right content-right">
              <h3
                class="text-36 font-bold text-right content-right lh-110 animate__animated animate__fadeInDown animate__faster"
                style="display: flex; flex-direction: column"
              >
                Çok Satanlar
              </h3>
              <div
                class="b-btn-small animate__animated animate__fadeInUp animate__faster animate-delay-03s"
              >
                HEMEN İNCELE
              </div>
            </div>
          </a>
          <img
            class="figure animate__animated animate__fadeInLeft animate__faster animate-delay-03s"
            src="images_listanyus/grid-1.webp"
            style="
              height: clamp(210px, calc(100vw * 317 / 1200), 317px);
              left: 0;
              margin-left: 0;
            "
          />
        </article>

        <!-- Right Bottom -->
        <article
          class="grid-2 animate__animated animate__fadeInRight animate__faster animate-delay-02s animate-disable-mobile p-24 surface-brand-light"
        >
          <a class="banner-link" href="/orkide">
            <div
              class="content content-left text-right content-right"
              style="align-items: end !important"
            >
              <h3
                class="text-36 font-bold text-right content-right lh-110 animate__animated animate__fadeInDown animate__faster"
                style="display: flex; flex-direction: column"
              >
                <span class="text-24 font-regular">En Çok Beğenilen</span
                >Orkideler
              </h3>
              <div
                class="b-btn-small animate__animated animate__fadeInUp animate__faster animate-delay-03s"
              >
                HEMEN İNCELE
              </div>
            </div>
          </a>
          <img
            class="figure animate__animated animate__fadeInLeft animate__faster animate-delay-03s"
            src="images_listanyus/grid-2.webp"
            style="
              height: clamp(210px, calc(100vw * 317 / 1200), 317px);
              left: 0;
              margin-left: 0;
            "
          />
        </article>

        <!-- Small Banners -->
        <div class="small-banners">
          <!-- Small 1 -->
          <article
            class="banner surface-brand-light animate__animated animate__fadeInUp animate__faster animate-delay-01s animate-disable-mobile p-24"
          >
            <a class="banner-link" href="/papatya">
              <div class="content content-right">
                <h3
                  class="text-24 font-bold text-right content-brand content-right lh-110 animate__animated animate__fadeInDown animate__faster"
                >
                  <span class="font-regular text-20 content-black"
                    >Çok Satan<br /></span
                  >Papatya ve Gerberalar
                </h3>
                <div
                  class="b-btn-small animate__animated animate__fadeInUp animate__faster animate-delay-03s"
                >
                  HEMEN İNCELE
                </div>
              </div>
            </a>
            <img
              class="figure animate__animated animate__fadeInLeft animate__faster animate-delay-02s"
              src="images_listanyus/small-1.webp"
              style="
                margin-left: 0;
                height: clamp(130px, calc(100vw * 205 / 1200), 205px);
              "
            />
          </article>

          <!-- Small 2 -->
          <article
            class="banner surface-brand-light animate__animated animate__fadeInUp animate__faster animate-delay-02s animate-disable-mobile p-24"
          >
            <a class="banner-link" href="/yeni-cicek-tasarimlari">
              <div class="content content-right">
                <h3
                  class="text-24 font-bold text-right content-brand content-right lh-110 animate__animated animate__fadeInDown animate__faster"
                >
                  <span class="font-regular text-20 content-black"
                    >2026<br /></span
                  >Yeni Tasarımlar
                </h3>
                <div
                  class="b-btn-small animate__animated animate__fadeInUp animate__faster animate-delay-03s"
                >
                  HEMEN İNCELE
                </div>
              </div>
            </a>
            <img
              class="figure animate__animated animate__fadeInLeft animate__faster animate-delay-02s"
              src="images_listanyus/small-2.webp"
              style="
                margin-left: 0;
                height: clamp(130px, calc(100vw * 205 / 1200), 205px);
              "
            />
          </article>

          <!-- Small 3 -->
          <article
            class="banner surface-brand-light animate__animated animate__fadeInUp animate__faster animate-delay-03s animate-disable-mobile p-24"
          >
            <a class="banner-link" href="/taze-cicek-pro">
              <div class="content content-right">
                <h3
                  class="text-24 font-bold content-brand text-right content-right lh-110 animate__animated animate__fadeInDown animate__faster"
                >
                  <span class="font-regular text-20 content-black"
                    >Taptaze<br /></span
                  >Premium Aranjmanlar
                </h3>
                <div
                  class="b-btn-small animate__animated animate__fadeInUp animate__faster animate-delay-03s"
                >
                  HEMEN İNCELE
                </div>
              </div>
            </a>
            <img
              class="figure animate__animated animate__fadeInLeft animate__faster animate-delay-02s"
              src="images_listanyus/small-3.webp"
              style="
                margin-left: 0;
                height: clamp(130px, calc(100vw * 205 / 1200), 205px);
              "
            />
          </article>
        </div>
      </section>
    </main>
  </body>
</html>

<style>
  .tcf1hb,
  .tcf1hb *,
  .tcf1hb *::before,
  .tcf1hb *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .tcf1hb {
    position: relative;
    width: 100%;
    height: 100px;
    background: #e7f0ff;
    font-family: "Nunito", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .tcf1hb-inner {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 76px;
  }

  .tcf1hb-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .tcf1hb-icon {
    width: 52px;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .tcf1hb-svg {
    width: 52px;
    height: 54px;
    display: block;
  }
  .tcf1hb-wing {
    transform-box: view-box;
    transform-origin: 19.8px 16px;
  }
  .tcf1hb-wing-l {
    animation: tcf1hb-flap-l 5s ease-in-out infinite;
  }
  .tcf1hb-wing-r {
    animation: tcf1hb-flap-r 5s ease-in-out infinite;
    animation-delay: 0.04s;
  }
  @keyframes tcf1hb-flap-l {
    0%, 72%, 100% { transform: none; }
    76% { transform: translateY(-0.6px) scale(0.36, 0.97); }
    80% { transform: none; }
    84% { transform: translateY(-0.6px) scale(0.36, 0.97); }
    89% { transform: scale(1.03, 1); }
    92% { transform: none; }
  }
  @keyframes tcf1hb-flap-r {
    0%, 72%, 100% { transform: none; }
    76% { transform: translateY(-0.6px) scale(0.3, 0.97); }
    80% { transform: none; }
    84% { transform: translateY(-0.6px) scale(0.3, 0.97); }
    89% { transform: scale(1.03, 1); }
    92% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tcf1hb-wing { animation: none; }
  }

  .tcf1hb-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex-shrink: 0;
  }
  .tcf1hb-t1,
  .tcf1hb-t2 {
    font-weight: 800;
    color: #003ca6;
    line-height: 1.1;
    white-space: nowrap;
  }
  .tcf1hb-t1 { font-size: 25px; }
  .tcf1hb-t2 { font-size: 32px; }

  .tcf1hb-badge {
    background: #003ca6;
    border-radius: 20px;
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .tcf1hb-badge-main {
    font-size: 52px;
    font-weight: 800;
    color: #e1aa2c;
    line-height: 1;
    letter-spacing: -1px;
    white-space: nowrap;
  }
  .tcf1hb-badge-sub {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tcf1hb-s1,
  .tcf1hb-s2 {
    color: #e1aa2c;
    white-space: nowrap;
    line-height: 1;
  }
  .tcf1hb-s1 { font-size: 16px; font-weight: 400; }
  .tcf1hb-s2 { font-size: 24px; font-weight: 800; }

  .tcf1hb-vp {
    position: relative;
    height: 100px;
    overflow: hidden;
    flex-shrink: 0;
    padding: 0 8px;
    margin: 0 -8px;
  }
  .tcf1hb-vp::before,
  .tcf1hb-vp::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 22px;
    z-index: 3;
    pointer-events: none;
  }
  .tcf1hb-vp::before {
    top: 0;
    background: linear-gradient(to bottom, #e7f0ff 0%, rgba(231, 240, 255, 0) 100%);
  }
  .tcf1hb-vp::after {
    bottom: 0;
    background: linear-gradient(to top, #e7f0ff 0%, rgba(231, 240, 255, 0) 100%);
  }

  .tcf1hb-track {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 7px;
    will-change: transform;
  }

  .tcf1hb-card {
    background: #e1aa2c;
    border-radius: 12px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    white-space: nowrap;
    transition:
      opacity 0.48s ease,
      filter 0.48s ease,
      transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tcf1hb-card.tcf1hb-is-active {
    opacity: 1;
    filter: blur(0px);
    transform: scale(1.05);
  }
  .tcf1hb-card.tcf1hb-is-inactive {
    opacity: 0.5;
    filter: blur(2.5px);
    transform: scale(0.88);
  }

  .tcf1hb-cond {
    font-size: 16px;
    font-weight: 600;
    font-style: italic;
    color: #292929;
    line-height: 1.2;
  }
  .tcf1hb-amt {
    font-size: 24px;
    font-weight: 900;
    color: #003ca6;
    line-height: 1.2;
  }

  @media (max-width: 899px) {
    .tcf1hb, .tcf1hb-vp { height: 80px; }
    .tcf1hb-inner { height: 64px; gap: 12px; }
    .tcf1hb-left { gap: 8px; }
    .tcf1hb-icon { width: 38px; height: 56px; }
    .tcf1hb-svg { width: 38px; height: 39px; }
    .tcf1hb-t1 { font-size: 17px; }
    .tcf1hb-t2 { font-size: 22px; }
    .tcf1hb-badge { border-radius: 14px; padding: 0 14px; height: 52px; gap: 6px; }
    .tcf1hb-badge-main { font-size: 34px; letter-spacing: -0.5px; }
    .tcf1hb-badge-sub { gap: 3px; }
    .tcf1hb-s1 { font-size: 12px; }
    .tcf1hb-s2 { font-size: 17px; }
    .tcf1hb-vp::before, .tcf1hb-vp::after { height: 18px; }
    .tcf1hb-track { gap: 5px; }
    .tcf1hb-card { border-radius: 10px; padding: 7px 10px; gap: 6px; }
    .tcf1hb-cond { font-size: 12px; }
    .tcf1hb-amt { font-size: 18px; }
  }

  @media (max-width: 599px) {
    .tcf1hb-inner {
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 0 8px;
      gap: 0;
    }
    .tcf1hb-left { gap: 6px; }
    .tcf1hb-icon { width: 32px; height: 40px; }
    .tcf1hb-svg { width: 32px; height: 33px; }
    .tcf1hb-t1 { font-size: 12px; }
    .tcf1hb-t2 { font-size: 15px; }
    .tcf1hb-badge { border-radius: 10px; padding: 0 12px; height: 44px; gap: 4px; }
    .tcf1hb-badge-main { font-size: 24px; }
    .tcf1hb-badge-sub { gap: 2px; }
    .tcf1hb-s1 { font-size: 10px; font-weight: 600; }
    .tcf1hb-s2 { font-size: 13px; }
    .tcf1hb-vp { padding: 0 6px; margin: 0 -6px; }
    .tcf1hb-track { gap: 4px; }
    .tcf1hb-card {
      border-radius: 8px;
      padding: 7px 8px;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .tcf1hb-cond { font-size: 10.5px; line-height: 1; }
    .tcf1hb-amt { font-size: 17px; line-height: 1; }
  }

  @media (max-width: 413px) {
    .tcf1hb, .tcf1hb-vp { height: 72px; }
    .tcf1hb-inner { height: 58px; padding: 0 6px; }
    .tcf1hb-icon { width: 28px; height: 34px; }
    .tcf1hb-svg { width: 28px; height: 29px; }
    .tcf1hb-t1 { font-size: 10.5px; }
    .tcf1hb-t2 { font-size: 13px; }
    .tcf1hb-badge { padding: 0 9px; height: 40px; }
    .tcf1hb-badge-main { font-size: 21px; }
    .tcf1hb-s1 { font-size: 9px; }
    .tcf1hb-s2 { font-size: 11.5px; }
    .tcf1hb-vp::before, .tcf1hb-vp::after { height: 16px; }
    .tcf1hb-card { padding: 6px 7px; }
    .tcf1hb-cond { font-size: 9.5px; }
    .tcf1hb-amt { font-size: 15.5px; }
  }

  @media (max-width: 359px) {
    .tcf1hb, .tcf1hb-vp { height: 65px; }
    .tcf1hb-inner { height: 52px; }
    .tcf1hb-icon { width: 25px; height: 32px; }
    .tcf1hb-svg { width: 25px; height: 26px; }
    .tcf1hb-t1 { font-size: 10px; }
    .tcf1hb-t2 { font-size: 12px; }
    .tcf1hb-badge { border-radius: 8px; padding: 0 8px; height: 36px; }
    .tcf1hb-badge-main { font-size: 18px; }
    .tcf1hb-s1 { font-size: 8px; }
    .tcf1hb-s2 { font-size: 11px; }
    .tcf1hb-vp::before, .tcf1hb-vp::after { height: 14px; }
    .tcf1hb-card { border-radius: 6px; padding: 6px 6px; }
    .tcf1hb-cond { font-size: 8px; }
    .tcf1hb-amt { font-size: 14px; }
  }
</style>

<script>
  (function () {
    "use strict";

    var TCF1HB_REAL_COUNT = 3;
    var TCF1HB_HOLD_MS = 1700;
    var TCF1HB_EASE_MS = 520;

    var tcf1hbVp = document.getElementById("tcf1hb-vp");
    var tcf1hbTrack = document.getElementById("tcf1hb-track");
    if (!tcf1hbVp || !tcf1hbTrack) return;
    var tcf1hbCards = Array.prototype.slice.call(
      tcf1hbTrack.querySelectorAll(".tcf1hb-card")
    );

    var tcf1hbCurrent = 0;
    var tcf1hbCurrentIdx = 1;
    var tcf1hbLocked = false;
    var tcf1hbTimer = null;
    var tcf1hbCardH = 0;
    var tcf1hbStep = 0;
    var tcf1hbMid = 0;

    function tcf1hbMeasure() {
      var gap = parseFloat(getComputedStyle(tcf1hbTrack).rowGap) || 0;
      tcf1hbCardH = tcf1hbCards[1].offsetHeight;
      tcf1hbStep = tcf1hbCardH + gap;
      tcf1hbMid = tcf1hbVp.clientHeight / 2;
    }

    function tcf1hbYFor(idx) {
      return tcf1hbMid - (idx * tcf1hbStep + tcf1hbCardH / 2);
    }

    function tcf1hbMoveTo(idx, animate) {
      tcf1hbTrack.style.transition = animate
        ? "transform " + TCF1HB_EASE_MS + "ms cubic-bezier(0.34,1.48,0.64,1)"
        : "none";
      tcf1hbTrack.style.transform = "translateY(" + tcf1hbYFor(idx) + "px)";
      tcf1hbCurrentIdx = idx;
    }

    function tcf1hbApplyStates(activeIdx) {
      tcf1hbCards.forEach(function (c, i) {
        c.classList.toggle("tcf1hb-is-active", i === activeIdx);
        c.classList.toggle("tcf1hb-is-inactive", i !== activeIdx);
      });
    }

    function tcf1hbAdvance() {
      if (tcf1hbLocked) return;
      tcf1hbLocked = true;

      var nextReal = (tcf1hbCurrent + 1) % TCF1HB_REAL_COUNT;

      if (tcf1hbCurrent === TCF1HB_REAL_COUNT - 1) {
        tcf1hbMoveTo(4, true);
        tcf1hbApplyStates(4);
        setTimeout(function () {
          tcf1hbCards.forEach(function (c) { c.style.transition = "none"; });
          tcf1hbMoveTo(1, false);
          tcf1hbApplyStates(1);
          void tcf1hbTrack.offsetHeight;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              tcf1hbCards.forEach(function (c) { c.style.transition = ""; });
              tcf1hbCurrent = 0;
              tcf1hbLocked = false;
            });
          });
        }, TCF1HB_EASE_MS + 80);
      } else {
        tcf1hbMoveTo(nextReal + 1, true);
        tcf1hbApplyStates(nextReal + 1);
        tcf1hbCurrent = nextReal;
        setTimeout(function () { tcf1hbLocked = false; }, TCF1HB_EASE_MS + 80);
      }
    }

    function tcf1hbOnResize() {
      tcf1hbMeasure();
      tcf1hbMoveTo(tcf1hbCurrentIdx, false);
    }

    function tcf1hbInit() {
      tcf1hbMeasure();
      tcf1hbMoveTo(1, false);
      tcf1hbApplyStates(1);
      tcf1hbCurrent = 0;
      if (!tcf1hbTimer) tcf1hbTimer = setInterval(tcf1hbAdvance, TCF1HB_HOLD_MS);
      window.addEventListener("resize", tcf1hbOnResize);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(tcf1hbOnResize);
    }

    if (document.readyState === "complete") {
      setTimeout(tcf1hbInit, 120);
    } else {
      window.addEventListener("load", function () { setTimeout(tcf1hbInit, 120); });
    }
  })();
</script>

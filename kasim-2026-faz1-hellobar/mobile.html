<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taze Çiçek – Kasım İndirimleri Faz 1 Hello Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #ffffff;
        font-family: "Nunito", sans-serif;
        padding-top: 100px;
      }

      /* ── HELLO BAR ── */
      .hello-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: #e7f0ff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }

      .bar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 480px;
        padding: 0 8px;
        height: 64px;
      }

      /* ── Star + Text ── */
      .bar-left {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .star-wrap {
        width: 32px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .star-svg {
        width: 32px;
        height: 33px;
        display: block;
      }
      /* Logodaki kelebek: arada bir iki kez kanat çırpar */
      .wing {
        transform-box: view-box;
        transform-origin: 19.8px 16px;
      }
      .wing-l {
        animation: wing-flap-l 5s ease-in-out infinite;
      }
      .wing-r {
        animation: wing-flap-r 5s ease-in-out infinite;
        animation-delay: 0.04s;
      }
      @keyframes wing-flap-l {
        0%, 72%, 100% { transform: none; }
        76% { transform: translateY(-0.6px) scale(0.36, 0.97); }
        80% { transform: none; }
        84% { transform: translateY(-0.6px) scale(0.36, 0.97); }
        89% { transform: scale(1.03, 1); }
        92% { transform: none; }
      }
      @keyframes wing-flap-r {
        0%, 72%, 100% { transform: none; }
        76% { transform: translateY(-0.6px) scale(0.3, 0.97); }
        80% { transform: none; }
        84% { transform: translateY(-0.6px) scale(0.3, 0.97); }
        89% { transform: scale(1.03, 1); }
        92% { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wing { animation: none; }
      }

      .bar-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex-shrink: 0;
      }
      .bar-text .t1 {
        font-size: 12px;
        font-weight: 800;
        color: #003ca6;
        line-height: 1.1;
        white-space: nowrap;
      }
      .bar-text .t2 {
        font-size: 15px;
        font-weight: 800;
        color: #003ca6;
        line-height: 1.1;
        white-space: nowrap;
      }

      /* ── Discount Badge ── */
      .bar-badge {
        background: #003ca6;
        border-radius: 10px;
        padding: 0 12px;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .badge-main {
        font-size: 24px;
        font-weight: 800;
        color: #e1aa2c;
        line-height: 1;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .badge-sub {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .badge-sub .s1 {
        font-size: 10px;
        font-weight: 600;
        color: #e1aa2c;
        white-space: nowrap;
        line-height: 1;
      }
      .badge-sub .s2 {
        font-size: 13px;
        font-weight: 800;
        color: #e1aa2c;
        white-space: nowrap;
        line-height: 1;
      }

      /* ── CAROUSEL ── */
      .carousel-vp {
        position: relative;
        height: 80px;
        overflow: hidden;
        flex-shrink: 0;
        /* Horizontal padding so scale(1.05) doesn't get clipped on the sides */
        padding: 0 6px;
        /* Negative margin to keep total width unchanged */
        margin: 0 -6px;
      }

      /* Fade top/bottom into bar background */
      .carousel-vp::before,
      .carousel-vp::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 18px;
        z-index: 3;
        pointer-events: none;
      }
      .carousel-vp::before {
        top: 0;
        background: linear-gradient(
          to bottom,
          #e7f0ff 0%,
          rgba(231, 240, 255, 0) 100%
        );
      }
      .carousel-vp::after {
        bottom: 0;
        background: linear-gradient(
          to top,
          #e7f0ff 0%,
          rgba(231, 240, 255, 0) 100%
        );
      }

      .offer-track {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        will-change: transform;
      }

      .offer-card {
        background: #e1aa2c;
        border-radius: 8px;
        padding: 7px 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
        white-space: nowrap;
        transition:
          opacity 0.48s ease,
          filter 0.48s ease,
          transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .offer-card.is-active {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1.05);
      }

      .offer-card.is-inactive {
        opacity: 0.5;
        filter: blur(2.5px);
        transform: scale(0.88);
      }

      .card-cond {
        font-size: 10.5px;
        font-weight: 600;
        font-style: italic;
        color: #292929;
        line-height: 1;
      }
      .card-amt {
        font-size: 17px;
        font-weight: 900;
        color: #003ca6;
        line-height: 1;
      }
      /* ── 360-413px: middle size ── */
      @media (min-width: 360px) and (max-width: 413px) {
        .hello-bar, .carousel-vp { height: 72px; }
        .bar-inner { height: 58px; padding: 0 6px; }
        .star-wrap { width: 28px; height: 34px; }
        .star-svg { width: 28px; height: 29px; }
        .bar-text .t1 { font-size: 10.5px; }
        .bar-text .t2 { font-size: 13px; }
        .bar-badge { padding: 0 9px; height: 40px; }
        .badge-main { font-size: 21px; }
        .badge-sub .s1 { font-size: 9px; }
        .badge-sub .s2 { font-size: 11.5px; }
        .carousel-vp::before, .carousel-vp::after { height: 16px; }
        .offer-card { padding: 6px 7px; }
        .card-cond { font-size: 9.5px; }
        .card-amt { font-size: 15.5px; }
      }

      /* ── 320-359px: back to the compact sizes so nothing is clipped ── */
      @media (max-width: 359px) {
        .hello-bar, .carousel-vp { height: 65px; }
        .bar-inner { height: 52px; padding: 0 6px; }
        .star-wrap { width: 25px; height: 32px; }
        .star-svg { width: 25px; height: 26px; }
        .bar-text .t1 { font-size: 10px; }
        .bar-text .t2 { font-size: 12px; }
        .bar-badge { border-radius: 8px; padding: 0 8px; height: 36px; }
        .badge-main { font-size: 18px; }
        .badge-sub .s1 { font-size: 8px; }
        .badge-sub .s2 { font-size: 11px; }
        .carousel-vp::before, .carousel-vp::after { height: 14px; }
        .offer-card { border-radius: 6px; padding: 6px 6px; }
        .card-cond { font-size: 8px; }
        .card-amt { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="hello-bar" id="helloBar">
      <div class="bar-inner">
        <!-- Star + Text -->
        <div class="bar-left">
          <div class="star-wrap" aria-hidden="true">
            <svg
              class="star-svg"
              width="32"
              height="33"
              viewBox="0 0 31 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path class="wing wing-l" d="M15.1042 7.44363C12.0736 3.32388 6.83556 -1.55211 3.37921 0.473737C1.9221 1.32645 1.00822 3.58228 0.502881 5.90443C-0.29385 9.88722 -0.131659 13.1965 0.902713 14.9027C1.55741 15.9958 2.70875 16.7563 4.30591 17.1646C5.50325 17.4609 6.86217 17.5755 8.27699 17.6185C8.92161 17.6383 9.57769 17.6418 10.2338 17.6383C8.07743 20.7357 6.50756 23.6487 6.41497 25.8804C6.30868 27.4868 8.60645 30.2723 12.4131 31.5816C18.1464 33.5686 20.0759 28.0897 20.246 23.3386C20.4427 17.8571 18.4751 11.9923 15.1071 7.44535H15.1042V7.44363Z" fill="#003CA6" />
              <path class="wing wing-r" d="M30.3454 12.1172C29.9714 11.4893 29.3132 11.0578 28.3951 10.8235C27.711 10.6547 26.9307 10.5892 26.1203 10.5616C25.7506 10.5504 25.3752 10.5487 24.9998 10.5513C26.2359 8.77523 27.1332 7.1077 27.187 5.82776C27.2465 4.907 25.8188 3.13093 23.6366 2.37985C20.3512 1.24204 19.3612 4.56075 19.2636 7.28083C19.1524 10.4195 20.2793 13.7821 22.2067 16.3842C23.9439 18.7434 26.9429 21.5367 28.9234 20.3782C29.759 19.8898 30.283 18.5961 30.5694 17.2679C31.0245 14.9863 30.9348 13.0896 30.3404 12.112L30.3433 12.1163H30.3447L30.3454 12.1172Z" fill="#003CA6" />
            </svg>
          </div>
          <div class="bar-text">
            <span class="t1">Kasım</span>
            <span class="t2">İndirimleri</span>
          </div>
        </div>

        <!-- Discount Badge -->
        <div class="bar-badge">
          <span class="badge-main">400 TL</span>
          <div class="badge-sub">
            <span class="s1">'ye varan</span>
            <span class="s2">İndirimler</span>
          </div>
        </div>

        <!-- Offer Carousel -->
        <div class="carousel-vp" id="carouselVP">
          <div class="offer-track" id="offerTrack">
            <!-- [0] Clone of real[2] = 400 TL (seamless backwards loop) -->
            <div class="offer-card is-inactive" aria-hidden="true">
              <span class="card-cond">2.800 TL ve üzeri</span>
              <span class="card-amt">400 TL</span>
            </div>

            <!-- [1] real[0]: 111 TL -->
            <div class="offer-card is-active" data-real="0">
              <span class="card-cond">1.111 TL ve üzeri</span>
              <span class="card-amt">111 TL</span>
            </div>

            <!-- [2] real[1]: 240 TL -->
            <div class="offer-card is-inactive" data-real="1">
              <span class="card-cond">1.800 TL ve üzeri</span>
              <span class="card-amt">240 TL</span>
            </div>

            <!-- [3] real[2]: 400 TL -->
            <div class="offer-card is-inactive" data-real="2">
              <span class="card-cond">2.800 TL ve üzeri</span>
              <span class="card-amt">400 TL</span>
            </div>

            <!-- [4] Clone of real[0] = 111 TL (seamless forward loop) -->
            <div class="offer-card is-inactive" aria-hidden="true">
              <span class="card-cond">1.111 TL ve üzeri</span>
              <span class="card-amt">111 TL</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var REAL_COUNT = 3;
        var HOLD_MS = 1700;
        var EASE_MS = 520;
        var GAP = 4;

        var vp = document.getElementById("carouselVP");
        var track = document.getElementById("offerTrack");
        var cards = Array.from(track.querySelectorAll(".offer-card"));
        // [0]=clone(-1), [1..3]=real, [4]=clone(3)

        var currentReal = 0;
        var locked = false;
        var timerID = null;

        var CARD_H = 0;
        var STEP = 0;
        var VP_MID = 0; // = vp.offsetHeight / 2 = 50px

        function measure() {
          CARD_H = cards[1].offsetHeight;
          STEP = CARD_H + GAP;
          VP_MID = vp.offsetHeight / 2; // 50
        }

        // Y so card[arrayIdx] center sits at VP_MID
        function yFor(idx) {
          return VP_MID - (idx * STEP + CARD_H / 2);
        }

        function moveTo(idx, animate) {
          track.style.transition = animate
            ? "transform " + EASE_MS + "ms cubic-bezier(0.34,1.48,0.64,1)"
            : "none";
          track.style.transform = "translateY(" + yFor(idx) + "px)";
        }

        function applyStates(activeIdx) {
          cards.forEach(function (c, i) {
            c.classList.toggle("is-active", i === activeIdx);
            c.classList.toggle("is-inactive", i !== activeIdx);
          });
        }

        function advance() {
          if (locked) return;
          locked = true;

          var nextReal = (currentReal + 1) % REAL_COUNT;
          var nextArr = nextReal + 1;

          if (currentReal === REAL_COUNT - 1) {
            // Last → slide to clone[4], snap to real[1]
            moveTo(4, true);
            applyStates(4);
            setTimeout(function () {
              // 1) Kart transition'larını kapat — flash önlenir
              cards.forEach(function (c) {
                c.style.transition = "none";
              });
              // 2) Track'i sessizce snap et
              moveTo(1, false);
              // 3) Active class'ı geç — transition yok, flash yok
              applyStates(1);
              // 4) Reflow'u zorla (değişiklikler hemen işlensin)
              void track.offsetHeight;
              // 5) 2 frame sonra transition'ları geri aç
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  cards.forEach(function (c) {
                    c.style.transition = "";
                  });
                  currentReal = 0;
                  locked = false;
                });
              });
            }, EASE_MS + 80);
          } else {
            moveTo(nextArr, true);
            applyStates(nextArr);
            currentReal = nextReal;
            setTimeout(function () {
              locked = false;
            }, EASE_MS + 80);
          }
        }

        function init() {
          measure();
          moveTo(1, false);
          applyStates(1);
          currentReal = 0;
          if (!timerID) timerID = setInterval(advance, HOLD_MS);
        }

        if (document.readyState === "complete") {
          setTimeout(init, 120);
        } else {
          window.addEventListener("load", function () {
            setTimeout(init, 120);
          });
        }
      })();
    </script>
  </body>
</html>
